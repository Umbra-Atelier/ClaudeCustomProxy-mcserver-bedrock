name: Release EduBedrockProxy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Jar & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit & Framing Vector Tests
        run: mvn test --no-transfer-progress

      - name: Build Fat Shaded Jar
        run: mvn clean package -DskipTests=false --no-transfer-progress

      - name: Generate SHA-256 Checksum
        run: |
          cd target
          JAR_FILE=$(ls EduBedrockProxy-*-all.jar | head -n 1)
          sha256sum "$JAR_FILE" > "${JAR_FILE}.sha256"
          echo "BUILT_JAR=target/$JAR_FILE" >> $GITHUB_ENV
          echo "CHECKSUM=target/${JAR_FILE}.sha256" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: "EduBedrockProxy Release ${{ github.ref_name || inputs.release_tag }}"
          body: |
            ### EduBedrockProxy - NetherNet WebRTC & PowerNukkitX Bridge
            
            This release includes:
            - **NetherNet WebRTC Answerer**: Grounded in live franchise signaling captures.
            - **JSON-RPC 2.0 Handler**: Automatic instant response acknowledging requests to prevent 5s `$/cancelRequest` timeouts.
            - **Unsigned 64-bit ID processing**: Safe handling of connection and NetherNet IDs exceeding `Long.MAX_VALUE`.
            - **Bedrock Batch Relaying**: Dynamic framing, compression, and varint translation between NetherNet data channels and RakNet `127.0.0.1:19133`.
            - **Education M365 Authentication Transformation**: Automatic extraction and synthesis of valid player chains for PowerNukkitX.
            - **Raspberry Pi 4 Optimization**: Lean resident memory footprint (~80MB heap max).
            
            #### Running on Raspberry Pi 4:
            ```bash
            java -Xms64M -Xmx256M -jar EduBedrockProxy-*-all.jar
            ```
          files: |
            ${{ env.BUILT_JAR }}
            ${{ env.CHECKSUM }}
          draft: false
          prerelease: false
